<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--seo-head-->
    <meta name="theme-color" content="#f5f6f1" />
    <script>
      (() => {
        const storageKey = "predixlab-theme";
        let theme = "light";

        try {
          const storedTheme = window.localStorage.getItem(storageKey);
          if (storedTheme === "light" || storedTheme === "dark") {
            theme = storedTheme;
          }
        } catch {
          theme = "light";
        }

        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.documentElement.style.backgroundColor =
          theme === "dark" ? "#111c19" : "#f5f6f1";
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute("content", theme === "dark" ? "#111c19" : "#f5f6f1");
      })();
    </script>
    <link rel="preload" href="/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/ibm-plex-mono-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <!--app-html--><div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
